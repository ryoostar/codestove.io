<div class="page__footer-follow">

  <ul class="socials">

    <li></li>

    {% for link in site.footer.links %}
    {% if link.url %}
    <li class="socials__item">
      <a href="{{link.url}}" rel="noopener noreferrer nofollow" target="_blank" class="socials__item__link" title="{{link.label}}">
        <i class="{{link.icon}} footer-icon" aria-hidden="true"></i>
      </a>
    </li>
    {% endif %}
    {% endfor %}


  </ul>

  </div>

  <div class="page__footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.footer.copyright | default: site.title }}. {% if site.footer.creator %} Created by <a rel="noopener noreferrer nofollow" target="_blank" href="{{site.footer.creator.url}}">{{site.footer.creator.name}}</a>{% endif %}
    <span class="page__footer-sep" aria-hidden="true">·</span>
    <a href="{{ '/imprint' | relative_url }}" class="page__footer-imprint">이용 안내 및 개인정보 처리방침</a>
  </div>
